name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: hermetic-foundation/meta/.github/workflows/release.yml@main
    with:
      default_branch: main
      install_nix: true
      artifact_command: |
        nix build .#release-aarch64
        mkdir -p dist
        cp -L result/* dist/
        (cd dist && sha256sum -c SHA256SUMS)
        (cd dist && sha256sum -c install.sh.sha256)
        tools/serve-release.sh --check dist
      release_files: dist/*
