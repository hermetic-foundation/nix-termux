name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: flake check
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","Linux","X64","monarchic-local","nixos"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check

  build-release:
    name: build release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner:
              - self-hosted
              - Linux
              - X64
              - monarchic-local
              - nixos
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build release bundle
        run: |
          nix build .#release
          mkdir -p dist
          cp -L result/* dist/

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release artifacts
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","Linux","X64","monarchic-local","nixos"]') }}
    needs:
      - build-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Merge release bundles
        run: |
          mkdir -p dist
          find bundles -mindepth 2 -maxdepth 2 -type f ! -name SHA256SUMS | sort | while IFS= read -r file; do
            name=$(basename "$file")
            if [ -e "dist/$name" ]; then
              cmp -s "$file" "dist/$name" || {
                printf 'conflicting release artifact: %s\n' "$name" >&2
                exit 1
              }
              continue
            fi
            cp "$file" "dist/$name"
          done
          (cd dist && sha256sum \
            install.sh \
            install.sh.sha256 \
            nix-termux-runtime.tar.gz \
            nix-termux-runtime.tar.gz.sha256 \
            nix-termux-channel-*.json \
            nix-termux-bootstrap-*.tar.gz \
            nix-termux-bootstrap-*.json \
            nix-termux-bootstrap-*.registration \
            > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          (cd dist && sha256sum -c install.sh.sha256)
          tools/serve-release.sh --check dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
