name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check

  build-runtime:
    name: build runtime archive
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build runtime archive
        run: |
          nix build .#installer
          mkdir -p dist
          cp result/* dist/
          nix build .#runtime-archive
          cp result/* dist/

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: dist/*
          if-no-files-found: error

  build-bootstrap:
    name: build bootstrap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build bootstrap artifacts
        run: |
          nix build .#bootstrap
          mkdir -p dist
          cp result/* dist/
          nix build .#channel
          cp result/* dist/

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release bootstrap artifacts
    runs-on: ubuntu-latest
    needs:
      - build-runtime
      - build-bootstrap
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
